    <script>
      window.__BK_LICENSING_BOOT__ = { startedAt: Date.now() };
      window.addEventListener('error', function(event){
        var box=document.getElementById('boot-error');
        if(box){box.style.display='block';box.textContent='Application failed to initialize. Please refresh and try again.';}
      });
      window.addEventListener('unhandledrejection', function(){
        var box=document.getElementById('boot-error');
        if(box){box.style.display='block';box.textContent='Application failed to initialize. Please refresh and try again.';}
      });
      setTimeout(function(){
        var root=document.getElementById('root');
        var loaded=window.__BK_LICENSING_APP_LOADED__===true;
        if(root && !loaded){
          var box=document.getElementById('boot-error');
          if(box){box.style.display='block';box.textContent='The secure application did not finish loading. Refresh the page or contact support.';}
        }
      }, 8000);
    </script>
    <script>
      (function () {
        var path = window.location.pathname; while (path.length > 1 && path.charAt(path.length - 1) === '/') path = path.slice(0, -1);
        var protectedPaths = ['/admin', '/dashboard', '/rep-dashboard', '/settings', '/rep', '/licenses', '/customers', '/products', '/billing', '/pricing', '/profile', '/reports'];
        if (protectedPaths.indexOf(path) === -1) return;
        var token = '';
        try { token = window.localStorage.getItem('saas_token') || window.sessionStorage.getItem('saas_token') || ''; } catch (_) {}
        if (!token) window.location.replace('/login/');
      })();
    </script>
