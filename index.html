    <script type="text/javascript">
      // Restores the real path after GitHub Pages' 404.html redirect trick
      // (deep links like /checkout/success?order=xxx would otherwise bounce to "/")
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
