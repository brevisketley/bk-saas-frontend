<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="BK Corp Club Licensing Platform login">
  <title>BK Corp Club Club — Sign In</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#111827;display:flex;align-items:center;justify-content:center;padding:24px}.card{width:100%;max-width:430px;background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:32px;box-shadow:0 18px 55px rgba(15,23,42,.08)}.brand{text-align:center;margin-bottom:28px}.brand-mark{width:48px;height:48px;margin:0 auto 12px;border-radius:12px;background:#2563eb;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px}.brand h1{margin:0;font-size:24px}.brand p{margin:6px 0 0;color:#6b7280}.field{margin-bottom:16px}.field label{display:block;margin-bottom:7px;font-size:14px;font-weight:600}.field input{width:100%;height:46px;border:1px solid #d1d5db;border-radius:9px;padding:0 13px;font-size:15px;outline:none}.field input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12)}button{width:100%;height:46px;border:0;border-radius:9px;background:#2563eb;color:#fff;font-size:15px;font-weight:700;cursor:pointer}button:disabled{opacity:.65;cursor:wait}.message{display:none;margin:0 0 16px;padding:11px 12px;border-radius:9px;font-size:14px}.error{background:#fef2f2;color:#b91c1c}.success{background:#ecfdf5;color:#047857}.links{text-align:center;margin-top:20px;font-size:14px}.links a{color:#2563eb;text-decoration:none}.status{text-align:center;margin-top:18px;color:#9ca3af;font-size:12px}
  </style>
</head>
<body>
  <main class="card">
    <header class="brand"><div class="brand-mark">BK</div><h1>BK Corp Club</h1><p>Licensing Platform</p></header>
    <div id="message" class="message"></div>
    <form id="loginForm">
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" placeholder="Email address" required></div>
      <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Password" required></div>
      <button id="submit" type="submit">Sign In</button>
    </form>
    <div class="links"><a href="/register">Create an account</a> · <a href="/">Back to platform</a></div>
    <div id="status" class="status">Secure licensing platform</div>
  </main>
<script>
(function(){
  const API='https://bk-saas-backend.onrender.com';
  const form=document.getElementById('loginForm'), button=document.getElementById('submit'), message=document.getElementById('message'), status=document.getElementById('status');
  function show(text,ok){message.textContent=text;message.className='message '+(ok?'success':'error');message.style.display='block'}
  form.addEventListener('submit',async function(e){
    e.preventDefault(); button.disabled=true; button.textContent='Signing in…'; message.style.display='none'; status.textContent='Connecting to secure licensing service…';
    try{
      const res=await fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json','x-tenant-domain':'bkcorp'},body:JSON.stringify({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value})});
      const data=await res.json().catch(()=>({}));
      if(!res.ok) throw new Error(data.error||'Login failed');
      if(!data.token) throw new Error('Authentication service returned no session token');
      localStorage.setItem('bk_auth_token',data.token); localStorage.setItem('bk_tenant_id',data.user?.tenantId||''); localStorage.setItem('bk_user',JSON.stringify(data.user||{}));
      show('Login successful. Opening your dashboard…',true); status.textContent='Authenticated';
      const role=data.user?.role; window.location.href=role==='admin'?'/admin':role==='rep'?'/rep-dashboard':'/dashboard';
    }catch(err){show(err.message||'Unable to sign in. Please try again.',false);status.textContent='Secure connection available';button.disabled=false;button.textContent='Sign In'}
  });
})();
</script>
</body>
</html>
