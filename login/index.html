<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="BK Corp Club Licensing Platform login">
  <title>BK Corp Club — Sign In</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 15% 15%,rgba(6,182,212,.22),transparent 35%),radial-gradient(ellipse at 85% 20%,rgba(79,70,229,.25),transparent 38%),linear-gradient(145deg,#030712,#08152b 52%,#10143a);color:#e2e8f0;display:flex;align-items:center;justify-content:center;padding:24px}.card{width:100%;max-width:440px;background:rgba(8,22,42,.92);border:1px solid rgba(103,232,249,.24);border-radius:22px;padding:34px;box-shadow:0 25px 80px rgba(0,0,0,.42),0 0 42px rgba(34,211,238,.09);backdrop-filter:blur(18px)}.brand{text-align:center;margin-bottom:28px}.brand-mark{width:54px;height:54px;margin:0 auto 14px;border-radius:16px;background:linear-gradient(135deg,#0891b2,#4f46e5);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:21px;box-shadow:0 0 28px rgba(34,211,238,.28)}.brand h1{margin:0;font-size:25px;letter-spacing:.04em;color:#f8fafc}.brand p{margin:6px 0 0;color:#9fb8d3}.field{margin-bottom:16px}.field label{display:block;margin-bottom:7px;font-size:14px;font-weight:600;color:#dbeafe}.field input{width:100%;height:46px;border:1px solid rgba(125,211,252,.28);background:rgba(2,8,23,.72);color:#f8fafc;border-radius:10px;padding:0 13px;font-size:15px;outline:none}.field input:focus{border-color:#22d3ee;box-shadow:0 0 0 3px rgba(34,211,238,.14)}.remember{display:flex;align-items:center;gap:10px;margin:3px 0 20px;color:#cbd5e1;font-size:13px}.remember input{width:16px;height:16px;accent-color:#06b6d4}.remember span{line-height:1.4}button{width:100%;height:47px;border:1px solid rgba(103,232,249,.35);border-radius:10px;background:linear-gradient(100deg,#0e7490,#4338ca);color:#fff;font-size:15px;font-weight:750;cursor:pointer;box-shadow:0 8px 24px rgba(8,145,178,.2)}button:disabled{opacity:.65;cursor:wait}.message{display:none;margin:0 0 16px;padding:11px 12px;border-radius:9px;font-size:14px}.error{background:rgba(127,29,29,.28);color:#fecaca;border:1px solid rgba(248,113,113,.25)}.success{background:rgba(6,95,70,.28);color:#a7f3d0;border:1px solid rgba(52,211,153,.25)}.links{text-align:center;margin-top:20px;font-size:14px;color:#94a3b8}.links a{color:#67e8f9;text-decoration:none}.status{text-align:center;margin-top:18px;color:#94a3b8;font-size:12px}
  </style>
</head>
<body>
  <main class="card">
    <header class="brand"><div class="brand-mark">BK</div><h1>BK Corp Club</h1><p>Licensing Platform</p></header>
    <div id="message" class="message"></div>
    <form id="loginForm">
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" placeholder="Email address" required></div>
      <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Password" required></div>
      <label class="remember" for="rememberDetails"><input id="rememberDetails" type="checkbox"><span>Save login details on this computer and automatically sign in next time</span></label><button id="submit" type="submit">Sign In</button>
    </form>
    <div class="links"><a href="/reset-password.html">Forgot password?</a><br><br><a href="/register">Create an account</a> · <a href="/">Back to platform</a></div>
    <div id="status" class="status">Secure licensing platform</div>
  </main>
<script src="/login-v2.js?v=20261108-remember-v3" defer></script>
</body>
</html>
