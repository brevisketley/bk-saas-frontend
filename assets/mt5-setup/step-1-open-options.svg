 x="80" y="410" fill="#f4d995" font-family="Arial,sans-serif" font-size="34" font-weight="700">STEP 1</text><text x="80" y="458" fill="#f5f8fc" font-family="Arial,sans-serif" font-size="29" font-weight="700">Open Tools → Options</text><text x="80" y="502" fill="#a9bfd4" font-family="Arial,sans-serif" font-size="20">In your MT5 desktop terminal, open the Tools menu and choose Options.</text><text x="80" y="572" fill="#6e8ca8" font-family="Arial,sans-serif" font-size="16" letter-spacing="2">ILLUSTRATION · MENU LABELS MAY VARY BY TERMINAL VERSION</text></svg>