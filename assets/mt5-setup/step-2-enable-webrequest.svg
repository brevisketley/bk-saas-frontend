<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc"><title id="title">MT5 setup step 2: enable WebRequest</title><desc id="desc">Illustrated Options dialog with Expert Advisors tab selected and Allow WebRequest for listed URL(s) checked.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071321"/><stop offset="1" stop-color="#172b42"/></linearGradient></defs><rect width="1280" height="640" rx="22" fill="url(#bg)"/><rect x="180" y="40" width="920" height="560" rx="14" fill="#edf2f6" stroke="#d5b36b" stroke-width="4"/><rect x="180" y="40" width="920" height="52" rx="14" fill="#dce5ed"/><text x="210" y="74" fill="#1b2b3a" font-family="Arial,sans-serif" font-size="21" font-weight="700">Options</text><g font-family="Arial,sans-serif" font-size="17" fill="#33485b"><text x="218" y="135">Server</text><text x="316" y="135">Charts</text><text x="410" y="135">Trade</text><text x="495" y="135">Expert Advisors</text><text x="640" y="135">Events</text></g><rect x="480" y="105" width="145" height="44" rx="5" fill="#d5b36b" fill-opacity=".45" stroke="#ad8037" stroke-width="2"/><g font-family="Arial,sans-serif" font-size="20" fill="#26384a"><rect x="228" y="184" width="24" height="24" rx="3" fill="#fff" stroke="#6c8090" stroke-width="2"/><text x="270" y="203">Allow algorithmic trading</text><rect x="228" y="238" width="24" height="24" rx="3" fill="#fff" stroke="#6c8090" stroke-width="2"/><text x="270" y="257">Allow DLL imports</text><rect x="228" y="292" width="24" height="24" rx="3" fill="#d5b36b" stroke="#a7782f" stroke-width="2"/><path d="M233 304 240 311 250 296" fill="none" stroke="#14283c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="270" y="311" font-weight="700">Allow WebRequest for listed URL(s)</text><rect x="260" y="348" width="690" height="90" rx="8" fill="#fff" stroke="#d5b36b" stroke-width="3"/><text x="288" y="385" fill="#75899b" font-size="17">The approved server address will be listed here in Step 3.</text><text x="288" y="415" fill="#75899b" font-size="16">Do not add unrelated addresses.</text><rect x="860" y="526" width="100" height="42" rx="6" fill="#18334c"/><text x="888" y="553" fill="#fff" font-size="18" font-weight="700">OK</text><rect x="974" y="526" width="100" height="42" rx="6" fill="#e0e7ee" stroke="#9aabba"/><text x="994" y="553" fill="#33485b" font-size="18">Cancel</text><text x="228" y="486" fill="#916b2c" font-family="Arial,sans-serif" font-size="17" font-weight="700">CHECK THIS BOX</text></svg>