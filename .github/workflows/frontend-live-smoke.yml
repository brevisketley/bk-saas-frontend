name: Frontend Live Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-live-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test live frontend routes, assets, auth handoff and backend readiness
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';

          const frontend = 'https://bk-saas-licensing-frontend.onrender.com';
          const backend = 'https://bk-saas-backend.onrender.com';

          async function get(url) {
            const isFrontend = url.startsWith(frontend);
            let response;
            let body = '';
            for (let attempt = 0; attempt < (isFrontend ? 13 : 1); attempt += 1) {
              response = await fetch(url, { redirect: 'follow', cache: 'no-store' });
              body = await response.text();
              if (response.status === 200) return { response, body };
              // Render static deploys start asynchronously after a push; retry temporary 404s
              // on frontend routes/assets while the new commit propagates.
              if (!isFrontend || response.status !== 404 || attempt === 12) break;
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            assert.equal(response.status, 200, `GET ${url} returned ${response.status}`);
            return { response, body };
          }

          const root = await get(frontend + '/');
          assert.match(root.body, /BK CORP CLUB|BK Corp Club/i, 'Root route did not return the BK Corp Club public landing page');

          const login = await get(frontend + '/login');
          assert.match(login.body, /id="loginForm"/, 'Direct login route did not serve the functional login page');
          assert.match(login.body, /login-v2\.js/, 'Login page is missing its authentication script');
          assert.match(login.body, /reset-password\.html/, 'Login page is missing password recovery');
          const loginScriptPath = login.body.match(/src="([^"]*login-v2\.js[^"]*)"/)?.[1];
          assert.ok(loginScriptPath, 'Login authentication script URL was not found');
          const loginScript = await get(new URL(loginScriptPath, frontend).toString());
          assert.match(loginScript.body, /auth\/login/, 'Login script is not connected to the authentication endpoint');
          for (const key of ['saas_token', 'saas_tenant_id', 'saas_tenant_domain']) {
            assert.ok(loginScript.body.includes(key), `Login script does not persist ${key} for the app session`);
          }

          const reset = await get(frontend + '/reset-password.html');
          assert.match(reset.body, /auth\/reset-password/, 'Password reset page is not wired to the reset endpoint');
          assert.match(reset.body, /token/, 'Password reset page does not handle its reset token');

          const manager = await get(frontend + '/license-manager.html');
          assert.match(manager.body, /id="productId" required/, 'License Manager is missing the required EA selector');
          assert.match(manager.body, /Select the EA this licence belongs to \(required\)/, 'License Manager is missing the EA allocation instruction');
          assert.doesNotMatch(manager.body, /General \/ Unspecified/, 'License Manager still permits unassigned EA licences');

          const health = await get(backend + '/health');
          assert.match(health.body, /"status":"ok"/, 'Backend health check failed');
          const ready = await get(backend + '/ready');
          assert.match(ready.body, /"status":"ready"/, 'Backend readiness check failed');
          assert.match(ready.body, /"database":"ok"/, 'Backend database readiness check failed');

          const badLogin = await fetch(backend + '/auth/login', {
            method: 'POST',
            headers: { 'content-type': 'application/json', 'x-tenant-domain': 'bkcorp' },
            body: JSON.stringify({ email: 'frontend-smoke-invalid-user@example.invalid', password: 'invalid-smoke-password' })
          });
          assert.equal(badLogin.status, 401, `Invalid credentials should be rejected with 401, got ${badLogin.status}`);

          const badReset = await fetch(backend + '/auth/reset-password', {
            method: 'POST',
            headers: { 'content-type': 'application/json', 'x-tenant-domain': 'bkcorp' },
            body: JSON.stringify({})
          });
          assert.equal(badReset.status, 400, `Malformed password reset should be rejected with 400, got ${badReset.status}`);

          console.log(JSON.stringify({
            ok: true,
            checks: [
              'root-route',
              'direct-login-route',
              'password-recovery-route',
              'login-session-storage-contract',
              'spa-js-and-css-assets',
              'admin-dashboard-registration-onboarding-rep-routes',
              'backend-health-and-database-readiness',
              'invalid-login-rejected',
              'malformed-password-reset-rejected'
            ]
          }, null, 2));
          NODE


      - name: Verify branded MT5 licence proxy
        run: |
          sleep 45
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base = 'https://www.bkcorpclub.com';
          const paths = ['/license/activate-v2', '/license/heartbeat-v2', '/license/deactivate-v2'];
          const results = [];
          for (const path of paths) {
            const response = await fetch(base + path, {
              method: 'POST',
              headers: { 'content-type': 'application/json', 'accept': 'application/json', 'x-tenant-domain': 'bkcorp' },
              body: '{}',
              redirect: 'manual',
              cache: 'no-store',
              signal: AbortSignal.timeout(15000)
            });
            const body = await response.text();
            const contentType = response.headers.get('content-type') || '';
            assert.notEqual(response.status, 404, `${path} returned 404: ${body.slice(0, 250)}`);
            assert.ok(response.status < 500, `${path} returned ${response.status}: ${body.slice(0, 250)}`);
            assert.match(contentType, /application\/json/i, `${path} returned non-JSON response: ${contentType}`);
            results.push({ path, status: response.status, contentType });
          }
          console.log(JSON.stringify({ ok: true, host: base, checks: results }, null, 2));
          NODE

      - name: Install browser test runtime
        run: |
          npm install --prefix /tmp/ea-browser-check playwright@1.55.0
          /tmp/ea-browser-check/node_modules/.bin/playwright install --with-deps chromium
      - name: Run browser-level login and protected-route regression
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { chromium } from '/tmp/ea-browser-check/node_modules/playwright/index.mjs';

          const frontend = 'https://bk-saas-licensing-frontend.onrender.com';
          const browser = await chromium.launch({ headless: true, args: ['--no-sandbox'] });
          const page = await browser.newPage();
          const pageErrors = [];
          page.on('pageerror', error => pageErrors.push(error.message));

          try {
            await page.goto(frontend + '/login', { waitUntil: 'domcontentloaded' });
            await page.locator('#loginForm').waitFor({ state: 'visible', timeout: 15000 });
            await page.locator('#email').fill('browser-smoke-invalid-user@example.invalid');
            await page.locator('#password').fill('Invalid-browser-smoke-password');
            await page.locator('#submit').click();
            await page.locator('#message').waitFor({ state: 'visible', timeout: 15000 });
            const message = await page.locator('#message').innerText();
            assert.match(message, /invalid credentials/i, `Login form did not display the expected authentication rejection: ${message}`);

            await page.goto(frontend + '/reset-password.html', { waitUntil: 'domcontentloaded' });
            await page.locator('#email').fill('browser-smoke-no-user@example.invalid');
            await page.locator('#submit').click();
            await page.locator('#message.show').waitFor({ state: 'visible', timeout: 15000 });
            assert.match(await page.locator('#message').innerText(), /if the account exists/i,
              'Password recovery did not return the generic safe response');

            await page.goto(frontend + '/reset-password.html?token=' + 'a'.repeat(64) + '&tenant=bkcorp', { waitUntil: 'domcontentloaded' });
            await page.locator('#password').fill('Invalid-reset-test-password');
            await page.locator('#confirm').fill('Invalid-reset-test-password');
            await page.locator('#submit').click();
            await page.locator('#message.show').waitFor({ state: 'visible', timeout: 15000 });
            assert.match(await page.locator('#message').innerText(), /invalid|expired/i,
              'Invalid password-reset token was not rejected in the browser');

            for (const path of ['/admin', '/dashboard', '/rep-dashboard']) {
              await page.goto(frontend + path, { waitUntil: 'domcontentloaded' });
              await page.waitForTimeout(1800);
              const currentPath = new URL(page.url()).pathname;
              const normalizedPath = currentPath.replace(/\/+$/, '') || '/';
              const redirectedToLogin = normalizedPath === '/login' || normalizedPath === '/login/index.html';
              assert.ok(redirectedToLogin, `Unauthenticated route ${path} did not redirect to login (current path: ${currentPath})`);
              assert.ok(await page.locator('body').innerText().then(t => /sign in|welcome back|licensing platform/i.test(t)),
                `Login UI missing after redirect from ${path}`);
            }

            await page.goto(frontend + '/license-manager.html', { waitUntil: 'domcontentloaded' });
            await page.waitForTimeout(1200);
            const legacyPath = new URL(page.url()).pathname;
            const normalizedLegacyPath = legacyPath.replace(/\/+$/, '') || '/';
            assert.ok(normalizedLegacyPath === '/login' || normalizedLegacyPath === '/login/index.html',
              `Unauthenticated legacy License Manager did not redirect to login (current path: ${legacyPath})`);

            assert.deepEqual(pageErrors, [], `Browser JavaScript errors: ${pageErrors.join('; ')}`);
            console.log(JSON.stringify({ ok: true, checks: ['browser-login-invalid-credentials', 'admin-route-requires-login', 'dashboard-route-requires-login', 'rep-route-requires-login', 'legacy-license-manager-requires-admin-login', 'no-browser-runtime-errors'] }, null, 2));
          } finally {
            await browser.close();
          }
          NODE
