<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>Password recovery | BK Corp Club Licensing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;font-family:'DM Sans',Inter,ui-sans-serif,system-ui,sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;position:relative;overflow-x:hidden;background:radial-gradient(ellipse at 15% 12%,rgba(0,205,232,.19),transparent 34%),radial-gradient(ellipse at 86% 18%,rgba(94,65,239,.23),transparent 36%),linear-gradient(145deg,#020611,#07162d 54%,#0c1030);color:#e5edf9;display:grid;place-items:center;padding:24px}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.19;background-image:linear-gradient(rgba(113,190,235,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(113,190,235,.08) 1px,transparent 1px);background-size:52px 52px}
    body:after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.1;background:url('/assets/bk-code-club-mark.svg') no-repeat 83% 48%/min(54vw,650px)}
    .card{position:relative;z-index:1;width:min(100%,480px);padding:clamp(28px,5vw,42px);border:1px solid rgba(103,232,249,.32);border-radius:24px;background:linear-gradient(145deg,rgba(10,29,54,.96),rgba(5,12,31,.97));box-shadow:0 35px 100px rgba(0,0,0,.55),0 0 65px rgba(34,211,238,.12),inset 0 1px rgba(255,255,255,.12);backdrop-filter:blur(22px)}
    .brand{display:flex;align-items:center;gap:13px;font:800 14px 'Space Grotesk';letter-spacing:.16em;color:#effaff}.brand img{width:48px;height:48px;filter:drop-shadow(0 0 20px rgba(34,211,238,.34))}.brand small{display:block;color:#83a7c8;font:600 9px 'DM Sans';letter-spacing:.2em;margin-top:4px}.accent{color:#62edff}
    h1{font:700 28px 'Space Grotesk';margin:25px 0 9px;letter-spacing:-.04em}p{color:#9fb0ca;line-height:1.65;font-size:14px}
    .field{display:block;margin-top:18px;font-size:12px;font-weight:700;color:#dbeafe}.field input{display:block;width:100%;margin-top:8px;padding:14px;background:rgba(2,8,23,.76);border:1px solid rgba(125,211,252,.28);border-radius:10px;color:#f8fafc;font-size:15px;outline:none}.field input:focus{border-color:#22d3ee;box-shadow:0 0 0 3px rgba(34,211,238,.14)}
    button{width:100%;margin-top:22px;padding:15px 16px;border:1px solid rgba(103,232,249,.55);border-radius:11px;background:linear-gradient(105deg,#087f9f,#3155bd 58%,#684bc0);color:white;font-weight:800;font-size:14px;cursor:pointer;box-shadow:0 12px 34px rgba(8,145,178,.25)}button:disabled{opacity:.6;cursor:wait}
    .message{margin-top:16px;padding:12px;border-radius:10px;font-size:13px;line-height:1.5;display:none}.message.show{display:block}.success{background:rgba(5,46,36,.8);border:1px solid #166534;color:#bbf7d0}.error{background:rgba(59,10,18,.8);border:1px solid #9f1239;color:#fecdd3}
    .back{display:block;margin-top:22px;text-align:center;color:#67e8f9;text-decoration:none;font-size:13px}.back:hover{text-decoration:underline}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><img src="/assets/bk-code-club-mark.svg" alt="BK Corp Club logo"><div>BK CORP CLUB<small>SECURE LICENSING PLATFORM</small></div></div>
    <h1 id="title">Forgot your password?</h1>
    <p id="intro">Enter the email address associated with your account. We'll send a secure, single-use reset link if the account exists.</p>
    <form id="recovery-form">
      <label class="field" id="email-field">Email address<input id="email" name="email" type="email" autocomplete="email" placeholder="you@company.com" required></label>
      <label class="field" id="password-field" hidden>New password<input id="password" name="password" type="password" minlength="6" autocomplete="new-password" placeholder="At least 6 characters"></label>
      <label class="field" id="confirm-field" hidden>Confirm new password<input id="confirm" name="confirm" type="password" minlength="6" autocomplete="new-password" placeholder="Re-enter your password"></label>
      <button id="submit" type="submit">Send reset link</button>
    </form>
    <div id="message" class="message" role="status" aria-live="polite"></div>
    <a class="back" href="/">← Back to sign in</a>
  </main>
<script>
(() => {
  const API = "https://bk-saas-backend.onrender.com";
  const params = new URLSearchParams(location.search);
  const token = params.get("token") || "";
  const tenant = (params.get("tenant") || "bkcorp").slice(0, 100);
  const form = document.getElementById("recovery-form");
  const emailField = document.getElementById("email-field");
  const passwordField = document.getElementById("password-field");
  const confirmField = document.getElementById("confirm-field");
  const email = document.getElementById("email");
  const password = document.getElementById("password");
  const confirm = document.getElementById("confirm");
  const submit = document.getElementById("submit");
  const message = document.getElementById("message");
  const title = document.getElementById("title");
  const intro = document.getElementById("intro");
  let busy = false;
  function show(text, kind) {
    message.textContent = text;
    message.className = "message show " + kind;
  }
  if (token) {
    title.textContent = "Choose a new password";
    intro.textContent = "Set a new password for your BK Corp Club Licensing account. The reset link can only be used once and expires after 30 minutes.";
    emailField.hidden = true;
    email.required = false;
    passwordField.hidden = false;
    confirmField.hidden = false;
    password.required = true;
    confirm.required = true;
    submit.textContent = "Reset password";
  }
  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    if (busy) return;
    if (token && password.value !== confirm.value) {
      show("The passwords do not match.", "error");
      return;
    }
    busy = true;
    submit.disabled = true;
    message.className = "message";
    try {
      const path = token ? "/auth/reset-password" : "/auth/forgot-password";
      const body = token ? { token, password: password.value } : { email: email.value.trim() };
      const response = await fetch(API + path, {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-tenant-domain": tenant },
        body: JSON.stringify(body)
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(result.error || "The request could not be completed. Please try again.");
      show(token ? "Password reset successfully. You can now sign in with your new password." : (result.message || "If the account exists, password reset instructions will be sent."), "success");
      if (token) {
        form.hidden = true;
        intro.textContent = "Your password has been updated.";
      } else {
        form.reset();
      }
    } catch (error) {
      show(error.message || "The request could not be completed. Please try again.", "error");
    } finally {
      busy = false;
      submit.disabled = false;
    }
  });
})();
</script>
</body>
</html>
