<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>Password recovery | BK Corp Club Licensing</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#14233d 0,#080d18 55%,#05070d 100%);color:#e5edf9;display:grid;place-items:center;padding:24px}
    .card{width:min(100%,460px);padding:32px;border:1px solid #263a58;border-radius:20px;background:rgba(11,18,32,.94);box-shadow:0 24px 70px #0008}
    .brand{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#8ca7ce;font-weight:700}.accent{color:#60a5fa}h1{font-size:27px;margin:16px 0 8px}p{color:#9fb0ca;line-height:1.55;font-size:14px}.field{display:block;margin-top:18px;font-size:13px;color:#cbd5e1}input{display:block;width:100%;margin-top:8px;padding:13px 14px;background:#080f1d;border:1px solid #31435e;border-radius:10px;color:#f8fafc;font-size:15px;outline:none}input:focus{border-color:#60a5fa;box-shadow:0 0 0 3px #3b82f633}button{width:100%;margin-top:22px;padding:13px 16px;border:0;border-radius:10px;background:linear-gradient(90deg,#2563eb,#3b82f6);color:white;font-weight:700;font-size:14px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.message{margin-top:16px;padding:12px;border-radius:10px;font-size:13px;line-height:1.5;display:none}.message.show{display:block}.success{background:#052e24;border:1px solid #166534;color:#bbf7d0}.error{background:#3b0a12;border:1px solid #9f1239;color:#fecdd3}.back{display:block;margin-top:22px;text-align:center;color:#93c5fd;text-decoration:none;font-size:13px}.back:hover{text-decoration:underline}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">BK Corp Club <span class="accent">/ Licensing</span></div>
    <h1 id="title">Forgot your password?</h1>
    <p id="intro">Enter the email address associated with your account. We'll send a secure, single-use reset link if the account exists.</p>
    <form id="recovery-form">
      <label class="field" id="email-field">Email address<input id="email" name="email" type="email" autocomplete="email" placeholder="you@company.com" required></label>
      <label class="field" id="password-field" hidden>New password<input id="password" name="password" type="password" minlength="6" autocomplete="new-password" placeholder="At least 6 characters"></label>
      <label class="field" id="confirm-field" hidden>Confirm new password<input id="confirm" name="confirm" type="password" minlength="6" autocomplete="new-password" placeholder="Re-enter your password"></label>
      <button id="submit" type="submit">Send reset link</button>
    </form>
    <div id="message" class="message" role="status" aria-live="polite"></div>
    <a class="back" href="/">← Back to sign in</a>
  </main>
<script>
(() => {
  const API = "https://bk-saas-backend.onrender.com";
  const params = new URLSearchParams(location.search);
  const token = params.get("token") || "";
  const tenant = (params.get("tenant") || "bkcorp").slice(0, 100);
  const form = document.getElementById("recovery-form");
  const emailField = document.getElementById("email-field");
  const passwordField = document.getElementById("password-field");
  const confirmField = document.getElementById("confirm-field");
  const email = document.getElementById("email");
  const password = document.getElementById("password");
  const confirm = document.getElementById("confirm");
  const submit = document.getElementById("submit");
  const message = document.getElementById("message");
  const title = document.getElementById("title");
  const intro = document.getElementById("intro");
  let busy = false;
  function show(text, kind) {
    message.textContent = text;
    message.className = "message show " + kind;
  }
  if (token) {
    title.textContent = "Choose a new password";
    intro.textContent = "Set a new password for your BK Corp Club Licensing account. The reset link can only be used once and expires after 30 minutes.";
    emailField.hidden = true;
    email.required = false;
    passwordField.hidden = false;
    confirmField.hidden = false;
    password.required = true;
    confirm.required = true;
    submit.textContent = "Reset password";
  }
  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    if (busy) return;
    if (token && password.value !== confirm.value) {
      show("The passwords do not match.", "error");
      return;
    }
    busy = true;
    submit.disabled = true;
    message.className = "message";
    try {
      const path = token ? "/auth/reset-password" : "/auth/forgot-password";
      const body = token ? { token, password: password.value } : { email: email.value.trim() };
      const response = await fetch(API + path, {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-tenant-domain": tenant },
        body: JSON.stringify(body)
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(result.error || "The request could not be completed. Please try again.");
      show(token ? "Password reset successfully. You can now sign in with your new password." : (result.message || "If the account exists, password reset instructions will be sent."), "success");
      if (token) {
        form.hidden = true;
        intro.textContent = "Your password has been updated.";
      } else {
        form.reset();
      }
    } catch (error) {
      show(error.message || "The request could not be completed. Please try again.", "error");
    } finally {
      busy = false;
      submit.disabled = false;
    }
  });
})();
</script>
</body>
</html>
